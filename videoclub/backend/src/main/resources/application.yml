server:
  port: 8080

spring:
  application:
    name: videoclub-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/videoclub_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
