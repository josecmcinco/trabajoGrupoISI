spring:
  application:
    name: siger-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/reportero_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
